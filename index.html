
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Shadow Blade</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070b14;color:white;font-family:monospace;overflow:hidden;touch-action:none}
#stage{position:relative;width:100vw;height:100dvh;display:flex;align-items:center;justify-content:center}
canvas{width:100%;height:auto;max-height:100dvh;aspect-ratio:16/9;object-fit:contain;image-rendering:pixelated;background:#111b30}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;font-size:12px;text-shadow:0 2px 5px #000}
#hp{color:#70eaff}
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050914bb;text-align:center}
h1{font-size:clamp(26px,6vw,48px);letter-spacing:5px;color:#b7f3ff;text-shadow:0 0 20px #168cff}
#menu p{font-size:12px;color:#b8c7de}
#start{padding:12px 25px;background:#16385d;border:1px solid #66dfff;color:white;border-radius:8px;font-weight:bold}
#controls{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;pointer-events:none}
.group{display:flex;gap:8px}
.ctrl{pointer-events:auto;width:52px;height:52px;background:#102744dd;border:1px solid #83bce9;border-radius:13px;color:white;font-size:22px;touch-action:none}
.ctrl:active{background:#347db6}
#hint{position:absolute;bottom:2px;text-align:center;width:100%;font-size:9px;color:#b3c7df;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
<canvas id="game" width="960" height="540"></canvas>
<div id="hud"><div>SHADOW BLADE<br><span id="hp">HP █████</span></div><div id="score">SCORE 0000</div></div>
<div id="menu"><h1 id="title">SHADOW BLADE</h1><p id="sub">Qaranlığın içindən keç.</p><button id="start">OYUNA BAŞLA</button></div>
<div id="controls">
 <div class="group"><button class="ctrl" data-k="left">◀</button><button class="ctrl" data-k="right">▶</button></div>
 <div class="group"><button class="ctrl" data-k="jump">⬆</button><button class="ctrl" data-k="dash">⚡</button><button class="ctrl" data-k="attack">⚔</button></div>
</div>
<div id="hint">A/D: Hərəkət · SPACE: Tullan · J: Hücum · K: Dash</div>
</div>
<script>
(()=>{
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=960,H=540,FLOOR=430,WORLD=4000;
const keys={left:false,right:false,jump:false,dash:false,attack:false};
let p,enemies=[],particles=[],cam=0,score=0,tick=0,active=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
function reset(){
 p={x:100,y:FLOOR,vx:0,vy:0,hp:100,face:1,ground:true,atk:0,atkcd:0,dash:0,dashcd:0,inv:0,walk:0};
 enemies=[];particles=[];cam=0;score=0;tick=0;
 for(let x=530;x<WORLD-100;x+=370)enemies.push({x,y:FLOOR,hp:3,face:-1,cd:50,hurt:0,walk:0,dead:false});
 hud();
}
function start(){reset();active=true;document.querySelector('#menu').style.display='none'}
document.querySelector('#start').onclick=start;
window.addEventListener('keydown',e=>{
 let k=e.key.toLowerCase();
 if(['arrowleft','arrowright','arrowup',' ','a','d','w','j','k'].includes(k))e.preventDefault();
 if(k==='a'||k==='arrowleft')keys.left=true;
 if(k==='d'||k==='arrowright')keys.right=true;
 if(k==='w'||k==='arrowup'||k===' ')keys.jump=true;
 if(k==='j')keys.attack=true;if(k==='k')keys.dash=true;
});
window.addEventListener('keyup',e=>{
 let k=e.key.toLowerCase();
 if(k==='a'||k==='arrowleft')keys.left=false;
 if(k==='d'||k==='arrowright')keys.right=false;
 if(k==='w'||k==='arrowup'||k===' ')keys.jump=false;
 if(k==='j')keys.attack=false;if(k==='k')keys.dash=false;
});
document.querySelectorAll('[data-k]').forEach(b=>{
 const k=b.dataset.k;
 const down=e=>{e.preventDefault();keys[k]=true;if(!active)start()};
 const up=e=>{e.preventDefault();keys[k]=false};
 b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);
 b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
});
function burst(x,y,color,n=8){
 for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-3,3),vy:rnd(-4,1),life:rnd(10,24),color,size:rnd(2,5)});
}
function hit(e){
 if(e.dead||e.hurt>0)return;
 e.hp--;e.hurt=12;e.x+=p.face*10;
 burst(e.x,e.y-30,'#75eaff',12);burst(e.x,e.y-30,'#fff',4);
 if(e.hp<=0){e.dead=true;score+=100;burst(e.x,e.y-25,'#399dff',20)}
}
function hud(){
 document.querySelector('#hp').textContent='HP '+('█'.repeat(Math.ceil(p.hp/20))).padEnd(5,'░');
 document.querySelector('#score').textContent='SCORE '+String(score).padStart(4,'0');
}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function background(){
 const gr=ctx.createLinearGradient(0,0,0,H);
 gr.addColorStop(0,'#0b142b');gr.addColorStop(.65,'#293d5b');gr.addColorStop(1,'#758090');
 ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
 // moon
 rect(760,65,42,42,'#d5eaff');rect(770,57,35,35,'#a8c0df');
 // mountains
 for(let i=0;i<10;i++){
  let x=((i*170-cam*.2)%1600+1600)%1600-200;
  ctx.fillStyle=i%2?'#263951':'#1a2b43';
  ctx.beginPath();ctx.moveTo(x,405);ctx.lineTo(x+100,200+i%3*25);ctx.lineTo(x+220,405);ctx.fill();
 }
 // distant ruins
 for(let i=0;i<15;i++){
  let x=((i*100-cam*.38)%1300+1300)%1300-100;
  rect(x,315,9,100,'#17273b');rect(x-10,330,30,7,'#17273b');
 }
}
function ground(){
 rect(0,FLOOR,WORLD,110,'#18212c');
 for(let x=0;x<WORLD;x+=32){
  rect(x,FLOOR,30,5,'#526271');rect(x+5,FLOOR+12,13,3,'#2a3d4c');
 }
 for(let x=170;x<WORLD;x+=360){
  rect(x,FLOOR-100,24,100,'#29394b');rect(x-6,FLOOR-106,36,9,'#526174');
  rect(x+5,FLOOR-140,4,35,'#29394b');
 }
}
// PIXEL-ART NINJA
function ninja(o,hero){
 const facing=o.face||1,x=o.x,y=o.y;
 const walk=Math.sin(o.walk||0)*3;
 ctx.save();ctx.translate(Math.round(x+14),Math.round(y));ctx.scale(facing,1);
 if(hero&&o.inv>0&&tick%6<3)ctx.globalAlpha=.35;
 // ground shadow
 rect(-17,0,34,4,'#080c15');
 // legs
 rect(-9,-23+Math.max(0,walk),8,19,'#0a1020');
 rect(2,-23+Math.max(0,-walk),8,19,'#10192b');
 rect(-12,-7+Math.max(0,walk),13,6,'#273d5a');
 rect(0,-7+Math.max(0,-walk),14,6,'#273d5a');
 rect(-11,-24,9,3,'#4b6d93');
 rect(2,-24,9,3,'#4b6d93');
 // torso and layered armor
 rect(-12,-49,24,28,'#10192c');
 rect(-10,-47,20,23,hero?'#183858':'#442633');
 rect(-8,-44,5,17,hero?'#2678a8':'#a33f4d');
 rect(3,-44,5,14,'#090f1d');
 rect(-14,-47,6,11,'#233d5b');
 rect(8,-47,6,11,'#233d5b');
 rect(-8,-30,16,4,'#60758f');
 rect(-2,-30,4,4,'#61dfff');
 // neck and hood
 rect(-7,-54,14,8,'#080f1c');
 rect(-10,-66,20,17,'#090f1d');
 rect(-12,-63,24,7,'#192b45');
 // mask and glowing eyes
 rect(-8,-59,16,7,'#263d59');
 rect(1,-57,6,3,hero?'#72f6ff':'#ff746e');
 rect(2,-58,3,2,'#ffffff');
 // hood peak and scarf
 rect(-10,-67,18,4,'#172b46');
 rect(-15,-52,8,4,hero?'#1489c5':'#922e43');
 rect(-20,-51,7,3,hero?'#30d9ff':'#d74b5c');
 rect(-25,-50,6,2,hero?'#147cb5':'#922e43');
 // arm and glove
 rect(8,-42,7,16,'#111b2c');
 rect(10,-29,8,5,'#324a68');
 // sword, visibly separate from body
 if(hero&&o.atk>0){
  ctx.save();ctx.translate(12,-38);ctx.rotate(-.85+(12-o.atk)*.13);
  rect(-2,-3,6,32,'#d8faff');
  rect(-1,0,3,25,'#73eaff');
  rect(-5,1,12,3,'#9ff5ff');
  rect(-2,28,7,4,'#d6a85e');
  ctx.restore();
  ctx.globalAlpha=.7;
  ctx.strokeStyle='#6ceaff';ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(0,-36,38,-1.15,.5);ctx.stroke();
  ctx.globalAlpha=1;
 }else{
  ctx.save();ctx.translate(12,-39);ctx.rotate(-.25);
  rect(-2,-1,5,29,'#d7f7ff');rect(-1,2,2,22,'#63cfff');
  rect(-5,0,11,4,'#a4edff');rect(-2,26,7,4,'#d5aa62');
  ctx.restore();
 }
 // bright blue outline accents
 rect(-12,-45,2,15,'#37b8ed');
 rect(10,-45,2,8,'#4fdfff');
 ctx.restore();
}
function enemyDraw(e){
 ctx.save();
 ctx.translate(e.x+14,e.y);ctx.scale(e.face,1);
 rect(-15,0,30,4,'#090b13');
 rect(-8,-22,7,18,'#1a101c');rect(2,-22,8,18,'#21111a');
 rect(-12,-6,13,5,'#5e2639');rect(0,-6,14,5,'#5e2639');
 rect(-12,-47,24,26,'#3b202e');rect(-9,-44,18,19,'#712f42');
 rect(-10,-63,20,17,'#201422');rect(-11,-60,22,7,'#552838');
 rect(1,-56,7,3,'#ff6b6b');
 rect(8,-39,6,16,'#452431');
 ctx.restore();
 // enemy health
 rect(e.x-2,e.y-76,34,4,'#11131c');
 rect(e.x-2,e.y-76,34*(e.hp/3),4,'#ff5b70');
}
function update(){
 tick++;if(!active)return;
 if(p.inv>0)p.inv--;if(p.atkcd>0)p.atkcd--;if(p.dashcd>0)p.dashcd--;if(p.atk>0)p.atk--;
 let d=(keys.right?1:0)-(keys.left?1:0);
 if(d)p.face=d;
 if(keys.dash&&p.dashcd<=0){p.dash=10;p.dashcd=45;p.inv=14;burst(p.x,p.y-25,'#42dfff',8)}
 p.vx=p.dash>0?p.face*10:d*3.2;if(p.dash>0)p.dash--;
 p.x=clamp(p.x+p.vx,0,WORLD-30);
 if(keys.jump&&p.ground){p.vy=-10.5;p.ground=false;burst(p.x,FLOOR,'#8499b3',6)}
 p.vy+=.48;p.y+=p.vy;
 if(p.y>=FLOOR){p.y=FLOOR;p.vy=0;p.ground=true}
 p.walk+=Math.abs(p.vx)*.13;
 if(keys.attack&&p.atkcd<=0){
  p.atk=12;p.atkcd=20;burst(p.x+p.face*25,p.y-32,'#8cecff',5);
  enemies.forEach(e=>{if(!e.dead&&Math.abs(e.x-p.x)<65&&(e.x-p.x)*p.face>-20)hit(e)});
 }
 enemies.forEach(e=>{
  if(e.dead)return;
  if(e.hurt>0){e.hurt--;return}
  e.walk+=.1;let dx=p.x-e.x;e.face=dx<0?-1:1;
  if(Math.abs(dx)>38)e.x+=e.face*1.1;
  else if(--e.cd<=0){
   e.cd=65;
   if(p.inv<=0){p.hp-=8;p.inv=35;burst(p.x,p.y-30,'#ff596a',8);
    if(p.hp<=0){p.hp=0;active=false;showEnd('MƏĞLUB OLDUN','Yenidən başlamaq üçün düyməyə bas.')}
   }
  }
 });
 enemies=enemies.filter(e=>!e.dead);
 particlesUpdate();
 cam=clamp(p.x-330,0,WORLD-W);
 if(p.x>WORLD-150&&enemies.length===0){active=false;showEnd('QƏLƏBƏ!','Sən Shadow Blade yolunu tamamladın.')}
 hud();
}
function particlesUpdate(){
 particles=particles.filter(q=>q.life>0);
 particles.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.13;q.life--});
}
let particles=[];
function hud(){
 document.querySelector('#hp').textContent='HP '+('█'.repeat(Math.ceil(p.hp/20))).padEnd(5,'░');
 document.querySelector('#score').textContent='SCORE '+String(score).padStart(4,'0');
}
function showEnd(title,sub){
 document.querySelector('#title').textContent=title;
 document.querySelector('#sub').textContent=sub;
 document.querySelector('#menu').style.display='flex';
}
function draw(){
 background();ctx.save();ctx.translate(-cam,0);ground();
 enemies.forEach(enemyDraw);if(p)ninja(p,true);
 particles.forEach(q=>{ctx.globalAlpha=Math.max(0,q.life/24);rect(q.x,q.y,q.size,q.size,q.color)});
 ctx.globalAlpha=1;ctx.restore();
 const v=ctx.createRadialGradient(W/2,H/2,130,W/2,H/2,570);
 v.addColorStop(0,'#00000000');v.addColorStop(1,'#030610aa');
 ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}
function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
let last=0,acc=0;
function loop(t){let dt=Math.min(40,t-last||16);last=t;acc+=dt;while(acc>=16.67){update();acc-=16.67}draw();requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
