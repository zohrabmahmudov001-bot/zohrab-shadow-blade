<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071326"><title>ZÖHRAB — The Shadow Blade</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101e;color:#f3f7ff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
body{display:flex;justify-content:center;background:#030914}#app{width:100%;height:100dvh;max-width:650px;display:flex;flex-direction:column;background:linear-gradient(#071326,#102b4a 65%,#050d19);position:relative}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;gap:8px} .logo{font-weight:950;letter-spacing:1px;font-size:18px}.logo span{color:#36a9ff}.chip{background:#07101ddd;border:1px solid #5ebdff55;border-radius:99px;padding:7px 10px;font-size:13px;font-weight:800}
#arena{position:relative;flex:1;min-height:0}canvas{display:block;width:100%;height:100%}
#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:#030a16b8}
.panel{width:100%;max-width:390px;border:1px solid #168dff88;background:linear-gradient(150deg,#08172af5,#06101ef7);border-radius:22px;padding:20px;text-align:center;box-shadow:0 0 32px #087bff22}
h1{font-size:clamp(29px,8vw,44px);line-height:1;margin:0;color:#f8fbff;font-style:italic;letter-spacing:1px}h1 span{color:#36a9ff}p{font-size:14px;line-height:1.45;color:#c1d6ed}
.portrait{font-size:74px;line-height:1.2;margin:12px auto 2px;filter:drop-shadow(0 0 14px #168dff)}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}.stats span{font-size:12px;padding:6px 8px;border:1px solid #328ce866;border-radius:9px;color:#bde5ff}
button{pointer-events:auto;position:relative;z-index:5;font:inherit;font-weight:850;color:#f4f8ff;background:#112c49;border:1px solid #3a9dff88;border-radius:13px;padding:12px 14px;touch-action:manipulation}
button:active{transform:scale(.97)}.primary{width:100%;background:linear-gradient(90deg,#167dff,#39c7ff);color:#061322;border:0;font-size:17px;padding:14px}.secondary{font-size:12px;margin-top:10px}
#controls{display:flex;justify-content:space-between;align-items:center;padding:10px 14px calc(12px + env(safe-area-inset-bottom));gap:10px;background:linear-gradient(transparent,#030914 25%)}
.group{display:flex;gap:9px}.ctrl{width:clamp(52px,14vw,68px);height:clamp(52px,14vw,68px);border-radius:50%;padding:0;font-size:22px;background:#0b2440eF;border:2px solid #48aaff88;user-select:none;-webkit-user-select:none}
#attack{background:#073d69;border-color:#3dc8ff}#energy{background:#153f83;border-color:#5db8ff}#jump{background:#152a44}
.note{text-align:center;color:#9bb9d8;font-size:11px;padding:0 8px 5px}
@media(min-width:500px){#app{border-left:1px solid #173858;border-right:1px solid #173858}}
</style></head>
<body><div id="app">
<header><div class="logo">ZÖHRAB <span>⚔</span></div><div class="chip">🪙 <b id="score">0</b></div><div class="chip">❤️ <b id="hp">3</b></div></header>
<div id="arena"><canvas id="game"></canvas><div id="menu"><div class="panel"><div class="portrait">🥷</div><h1>ZÖH<span>RAB</span></h1><p><b>THE SHADOW BLADE</b><br>Qılınc və mavi enerji ustası</p><div class="stats"><span>⚔ Qılınc zərbəsi</span><span>🔷 Enerji atəşi</span><span>💨 Sürətli sıçrayış</span></div><button id="start" class="primary">OYUNA BAŞLA</button><button id="how" class="secondary">İDARƏETMƏ</button><p class="secondary">Created by Zöhrab Mahmudov</p></div></div></div>
<div class="note">◀ ▶ hərəkət · ▲ tullan · ⚔ qılınc · 🔷 enerji</div>
<div id="controls"><div class="group"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><div class="group"><button class="ctrl" id="jump">▲</button><button class="ctrl" id="attack">⚔</button><button class="ctrl" id="energy">🔷</button></div></div>
</div>
<script>
(()=>{const c=document.querySelector('#game'),x=c.getContext('2d'),menu=document.querySelector('#menu');let w=360,h=500,dpr=1,active=false,last=0,cam=0,score=0,hp=3,attackT=0,energyT=0,inv=0,projectiles=[],particles=[];
const k={l:false,r:false};let jump=false,p;
function size(){const r=c.getBoundingClientRect();w=r.width;h=r.height;dpr=Math.min(devicePixelRatio||1,2);c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);draw()}
function reset(){score=0;hp=3;cam=0;attackT=0;energyT=0;inv=0;projectiles=[];particles=[];p={x:50,y:h-88,vx:0,vy:0,ground:true,face:1};document.querySelector('#score').textContent=score;document.querySelector('#hp').textContent=hp}
function begin(){reset();active=true;menu.style.display='none';last=performance.now();requestAnimationFrame(loop)}
function end(){active=false;menu.style.display='flex';menu.innerHTML=`<div class="panel"><div class="portrait">⚔️</div><h1>${hp>0?'ƏLA!':'YENİDƏN SINA'}</h1><p>Toplanan enerji kristalları: <b>${score}</b></p><button class="primary" id="again">YENİDƏN OYNA</button><p class="secondary">Created by Zöhrab Mahmudov</p></div>`;document.querySelector('#again').onclick=()=>location.reload()}
function hold(id,key){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();k[key]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();k[key]=false}))}
hold('left','l');hold('right','r');
document.querySelector('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jump=true});
document.querySelector('#attack').addEventListener('pointerdown',e=>{e.preventDefault();attackT=.22;for(let i=0;i<8;i++)particles.push({x:p.x+p.face*28,y:p.y+18,vx:p.face*(60+Math.random()*150),vy:(Math.random()-.5)*140,t:.24,blue:false})});
document.querySelector('#energy').addEventListener('pointerdown',e=>{e.preventDefault();if(energyT<=0){energyT=.65;projectiles.push({x:p.x+p.face*28,y:p.y+15,vx:p.face*370,t:1})}});
const startControl=document.querySelector('#start');
const howControl=document.querySelector('#how');
startControl.addEventListener('pointerup',e=>{e.preventDefault();begin();});
startControl.addEventListener('click',e=>{e.preventDefault();if(!active)begin();});
howControl.addEventListener('pointerup',e=>{e.preventDefault();alert('Sol və sağ düymələri ilə hərəkət et. ▲ ilə tullan. ⚔ ilə qılınc zərbəsi vur. 🔷 ilə mavi enerji atəşi göndər.');});
howControl.addEventListener('click',e=>{e.preventDefault();});
function update(dt){p.vx=((k.r?1:0)-(k.l?1:0))*205;if(p.vx)p.face=Math.sign(p.vx);if(jump&&p.ground){p.vy=-420;p.ground=false}jump=false;p.vy+=950*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;let floor=h-55;if(p.y+34>=floor){p.y=floor-34;p.vy=0;p.ground=true}p.x=Math.max(cam,p.x);cam=Math.max(0,p.x-w*.32);attackT=Math.max(0,attackT-dt);energyT=Math.max(0,energyT-dt);inv=Math.max(0,inv-dt);
for(let q of projectiles){q.x+=q.vx*dt;q.t-=dt;if(q.t>0&&q.x>cam+w)q.t=0;if(q.t>0&&Math.floor(q.x/230)!==Math.floor((q.x-q.vx*dt)/230)){score++;document.querySelector('#score').textContent=score}}
projectiles=projectiles.filter(q=>q.t>0);for(let a of particles){a.x+=a.vx*dt;a.y+=a.vy*dt;a.t-=dt}particles=particles.filter(a=>a.t>0);
if(p.y>h+100){hp--;document.querySelector('#hp').textContent=hp;p.y=floor-34;p.vy=0;if(hp<=0)end()}
}
function draw(){x.clearRect(0,0,w,h);let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#061020');g.addColorStop(1,'#173e63');x.fillStyle=g;x.fillRect(0,0,w,h);
x.fillStyle='#c7e8ff';x.beginPath();x.arc(w*.78,h*.15,23,0,7);x.fill();for(let i=0;i<45;i++){x.fillStyle='#b7dfff';x.globalAlpha=.2+(i%4)*.12;x.fillRect((i*73-cam*.12)%(w+8),i*47%h,2,2)}x.globalAlpha=1;
x.fillStyle='#0b1c30';x.beginPath();x.moveTo(0,h-80);for(let a=0;a<=w+10;a+=24)x.lineTo(a,h-90-Math.sin((a+cam*.15)*.025)*25);x.lineTo(w,h);x.lineTo(0,h);x.fill();
x.fillStyle='#203d4a';x.fillRect(0,h-55,w,100);x.fillStyle='#4e9b85';x.fillRect(0,h-55,w,4);for(let i=0;i<14;i++){let bx=(i*83-cam*.7)%(w+30);x.fillStyle='#102c3c';x.fillRect(bx,h-94,7,39);x.fillRect(bx-7,h-94,21,5)}
for(let i=0;i<7;i++){let cx=(i*105+110-cam*.75)%(w+30);if(cx<0)cx+=w+30;x.fillStyle='#ffd166';x.beginPath();x.arc(cx,h-83-(i%3)*27,6,0,7);x.fill();x.fillStyle='#fff0ae';x.fillRect(cx-1,h-88-(i%3)*27,2,10)}
// hero hood and cloak
let px=p.x-cam,py=p.y;if(inv<=0||Math.floor(inv*15)%2===0){x.fillStyle='#08111f';x.beginPath();x.moveTo(px+4,py+8);x.lineTo(px+18,py+2);x.lineTo(px+28,py+13);x.lineTo(px+24,py+31);x.lineTo(px+5,py+31);x.fill();x.fillStyle='#111d31';x.beginPath();x.arc(px+15,py+8,11,Math.PI,Math.PI*2);x.fill();x.fillStyle='#35baff';x.fillRect(px+(p.face>0?17:7),py+8,6,2);x.fillStyle='#1a2b43';x.fillRect(px+6,py+27,7,8);x.fillRect(px+17,py+27,7,8);
if(attackT>0){x.save();x.translate(px+15,py+17);x.scale(p.face,1);x.strokeStyle='#bdeeff';x.lineWidth=5;x.shadowColor='#168dff';x.shadowBlur=16;x.beginPath();x.arc(8,0,27,-1.05,.9);x.stroke();x.strokeStyle='#288dff';x.lineWidth=2;x.beginPath();x.arc(8,0,31,-1.05,.9);x.stroke();x.restore()}
}
for(let q of projectiles){let qx=q.x-cam;x.shadowColor='#138dff';x.shadowBlur=18;x.fillStyle='#67e0ff';x.beginPath();x.ellipse(qx,q.y,14,5,0,0,7);x.fill();x.fillStyle='#fff';x.fillRect(qx-5,q.y-2,10,4);x.shadowBlur=0}
for(let a of particles){x.globalAlpha=Math.max(0,a.t/.24);x.fillStyle='#4ac8ff';x.fillRect(a.x-cam,a.y,4,4)}x.globalAlpha=1;x.fillStyle='#d8eaff';x.font='12px system-ui';x.fillText('MƏSAFƏ '+Math.floor(p.x/10)+' m',12,20);if(!active){x.fillStyle='#fff';x.font='bold 16px system-ui';x.fillText('ZÖHRAB — THE SHADOW BLADE',12,45)}}
function loop(t){if(!active)return;let dt=Math.min((t-last)/1000,.035);last=t;update(dt);draw();if(active)requestAnimationFrame(loop)}
addEventListener('resize',size);size();reset();draw();
})();
</script></body></html>
